version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: cryptotrace-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cryptotrace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cryptotrace"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cryptotrace-backend
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/cryptotrace
      - DATABASE_SYNC_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/cryptotrace
      - DEMO_FIXTURE_MODE=true
      - PROVIDER_TIMEOUT_SECONDS=10.0
      - PROVIDER_MAX_RETRIES=3
      - API_KEYS=${API_KEYS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn cryptotrace.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
