[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptotrace"
version = "0.1.0"
description = "CryptoTrace - Enterprise Blockchain Forensics & Threat Intelligence Engine"
authors = [{ name = "Senior Blockchain Backend Engineer", email = "dev@cryptotrace.io" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "networkx>=3.2.1",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "python-dotenv>=1.0.1",
    "cryptography>=43.0.0",
    "rapidfuzz>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-timeout>=2.3.1",
    "ruff>=0.7.0",
    "bandit>=1.7.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cryptotrace*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: Unit tests for CryptoTrace modules",
    "integration: FastAPI and SQLAlchemy integration tests",
    "adversarial: Adversarial attack simulations and negative tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["cryptotrace", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["cryptotrace"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S108"]

[tool.bandit]
targets = ["cryptotrace"]
exclude_dirs = ["tests", ".venv"]
